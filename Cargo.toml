[workspace]
resolver = "2"
members = [
    "crates/klip-proto",
    "crates/klip-crypto",
    "crates/klip-diff",
    "crates/klip-platform",
    "crates/klip-net",
    "crates/klip-core",
    "crates/klip-android",
    "crates/klip-daemon",
    "crates/klip-cli",
    "crates/klip-tui",
]

[workspace.package]
version = "0.8.1"
edition = "2021"
rust-version = "1.91"
authors = ["Klip Engineering Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Tribal-Chief-001/Klip"

[workspace.dependencies]
# Async Runtime & Utilities
tokio = { version = "1.40", features = ["rt", "rt-multi-thread", "net", "time", "sync", "macros", "io-util", "fs", "signal"] }

# Cryptography & Security
blake3 = "1.5"
rand = "0.8"
ed25519-dalek = { version = "2.1", features = ["rand_core", "serde"] }

# Serialization & Diff
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["png", "bmp", "webp"] }

# Terminal UI & CLI
clap = { version = "4.5", features = ["derive"] }
directories = "5.0"
owo-colors = "4.1"
qrcode = { version = "0.14", default-features = false }
unicode-width = "0.2"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
crossterm = { version = "=0.29.0", features = ["event-stream", "bracketed-paste"] }
futures-util = "0.3"
async-trait = "0.1"
unicode-segmentation = "1"

# Clipboard
arboard = "3.4"
# X11 selection-change events (no polling) for the Linux driver
x11rb = { version = "0.13", default-features = false, features = ["xfixes"] }

# Networking
iroh = { version = "1", default-features = false, features = ["tls-ring", "portmapper"] }
postcard = { version = "1", features = ["use-std"] }
data-encoding = "2"
subtle = "2"

# Internal workspace crates
klip-proto = { path = "crates/klip-proto" }
klip-crypto = { path = "crates/klip-crypto" }
klip-diff = { path = "crates/klip-diff" }
klip-platform = { path = "crates/klip-platform" }
klip-net = { path = "crates/klip-net" }
klip-core = { path = "crates/klip-core" }
uniffi = "0.32"
klip-daemon = { path = "crates/klip-daemon" }
klip-tui = { path = "crates/klip-tui" }

# Test-only: drive the real binary in a pseudo-terminal and read its screen
portable-pty = "=0.9.0"
vt100 = "=0.16.2"

# Smaller dev artifacts: full debuginfo for ~400 crates took 15 GB on a 180 GB disk.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = true

# Profile for the Android native library. Differs from `release` on purpose:
# - thin LTO + several codegen units: fat LTO of the iroh stack needs several GB of RAM.
# - panic = "abort" (inherited from release): measured 12.3 MB -> 10.1 MB for the arm64 library
#   (2026-10-13). A Rust panic kills the app process instead of becoming a Kotlin exception; the
#   foreground service is START_STICKY and Android restarts it (about 5 s, tested on an emulator),
#   which is also the safer outcome here: after an unwound panic a std Mutex stays poisoned and
#   every later lock().unwrap() would panic again, leaving a half-dead engine.
[profile.android]
inherits = "release"
lto = "thin"
codegen-units = 4
