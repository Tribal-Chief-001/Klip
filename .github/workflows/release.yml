name: Release Publisher

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Release Asset (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: klip-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: klip-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: klip-windows-x86_64.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build hardened release binary
        run: cargo build --release --target ${{ matrix.target }} --bin klip

      - name: Package release artifact (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cp target/${{ matrix.target }}/release/klip ./${{ matrix.artifact_name }}
          chmod +x ./${{ matrix.artifact_name }}

      - name: Package release artifact (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          copy target\${{ matrix.target }}\release\klip.exe .\${{ matrix.artifact_name }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
