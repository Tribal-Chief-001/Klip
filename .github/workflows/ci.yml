name: CI & Hardening Matrix

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry and build target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Code format verification
        run: cargo fmt --all -- --check

      - name: Workspace Clippy verification
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run complete test suite
        run: cargo test --workspace --verbose
        env:
          KLIP_REQUIRE_DBUS_TESTS: "1"

      - name: Compile hardened release binary
        run: cargo build --release --bin klip

      - name: Verify binary size budget (< 9.5MiB)
        run: |
          BINARY_SIZE=$(stat -c%s target/release/klip)
          echo "Release binary size: $BINARY_SIZE bytes"
          if [ $BINARY_SIZE -gt 9961472 ]; then
            echo "Binary size exceeded the 9.5MiB budget!"
            exit 1
          fi

  dependency-audit:
    name: Dependency audit (RustSec)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Fails on known vulnerabilities. "Unmaintained" notices are printed as warnings and do not
      # fail the job (the current ones come from iroh's dependency tree).
      - name: cargo audit
        run: cargo audit

  cross-platform-check:
    name: Compile check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-check-

      # Proves the workspace compiles on these OSes. It does NOT prove clipboard behaviour there.
      - name: cargo check (all targets)
        run: cargo check --workspace --all-targets
