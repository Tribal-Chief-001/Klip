name: CI & Hardening Matrix

on:
  push:
    branches: [ "main", "platforms" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry and build target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Code format verification
        run: cargo fmt --all -- --check

      - name: Workspace Clippy verification
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run complete test suite
        run: cargo test --workspace --verbose
        env:
          KLIP_REQUIRE_DBUS_TESTS: "1"

      - name: Compile hardened release binary
        run: cargo build --release --bin klip

      - name: Verify binary size budget (< 9.5MiB)
        run: |
          BINARY_SIZE=$(stat -c%s target/release/klip)
          echo "Release binary size: $BINARY_SIZE bytes"
          if [ $BINARY_SIZE -gt 9961472 ]; then
            echo "Binary size exceeded the 9.5MiB budget!"
            exit 1
          fi

  dependency-audit:
    name: Dependency audit (RustSec)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Fails on known vulnerabilities. "Unmaintained" notices are printed as warnings and do not
      # fail the job (the current ones come from iroh's dependency tree).
      - name: cargo audit
        run: cargo audit

  cross-platform-check:
    name: Compile check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-check-

      # Proves the workspace compiles on these OSes. It does NOT prove clipboard behaviour there.
      - name: cargo check (all targets)
        run: cargo check --workspace --all-targets

  # The only place macOS and Windows code runs. It proves what a runner can prove (the tests that
  # run on every OS, the tray starting without a crash) and prints the tray's memory; it does not
  # prove how anything looks in a real menu bar or notification area.
  platform-tests:
    name: Platform tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Build klip
        run: cargo build --bin klip

      - name: Tray unit and command tests
        run: cargo test -p klip-cli --lib --test tray_cli --test tray_controller

      # Real daemons on this OS: start, send, history, stop through the control channel (the Unix
      # socket on macOS, the named pipe on Windows).
      - name: Windows daemon manual check (control pipe)
        if: runner.os == 'Windows'
        timeout-minutes: 4
        shell: pwsh
        run: |
          $klip = (Resolve-Path .\target\debug\klip.exe).Path
          $env:KLIP_CONFIG_DIR = "$env:RUNNER_TEMP\klip-manual"
          $env:KLIP_CLIPBOARD = "memory"
          New-Item -ItemType Directory -Force $env:KLIP_CONFIG_DIR | Out-Null
          '{"relay":"lan","lan_discovery":false}' | Set-Content "$env:KLIP_CONFIG_DIR\config.json"
          $d = Start-Process $klip -ArgumentList "start","--foreground" -PassThru -WindowStyle Hidden `
               -RedirectStandardOutput "$env:RUNNER_TEMP\d.out" -RedirectStandardError "$env:RUNNER_TEMP\d.err"
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Milliseconds 500
            & $klip status *> $null
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
          }
          Get-Content "$env:RUNNER_TEMP\d.out", "$env:RUNNER_TEMP\d.err" -ErrorAction SilentlyContinue
          if (-not $ok) { Stop-Process -Id $d.Id -Force; throw "the daemon never answered on the control pipe" }
          & $klip status
          & $klip send "hello from the runner"
          if ($LASTEXITCODE -ne 0) { throw "send failed" }
          $history = (& $klip history) -join "`n"
          Write-Host $history
          if ($history -notmatch "hello from the runner") { throw "the sent text is not in the history" }
          & $klip stop
          Start-Sleep -Seconds 2
          if (-not $d.HasExited) { Stop-Process -Id $d.Id -Force; throw "the daemon did not stop" }

      - name: CLI against a real daemon
        timeout-minutes: 8
        run: cargo test -p klip-cli --test cli_daemon -- --test-threads=1

      - name: Control channel and core tests
        run: cargo test -p klip-core -p klip-daemon

      - name: Tray smoke start and stop (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          export KLIP_CONFIG_DIR="$RUNNER_TEMP/klip-smoke" KLIP_CLIPBOARD=memory
          mkdir -p "$KLIP_CONFIG_DIR"
          ./target/debug/klip tray run > "$RUNNER_TEMP/tray.log" 2>&1 &
          PID=$!
          sleep 10
          kill -0 $PID 2>/dev/null || { echo "the tray exited early:"; cat "$RUNNER_TEMP/tray.log"; exit 1; }
          echo "tray is running, pid $PID, rss (KiB): $(ps -o rss= -p $PID)"
          # A stop request (what a person's kill or a logout sends) must end it, not leave a dead icon.
          kill -TERM $PID
          for i in $(seq 1 20); do kill -0 $PID 2>/dev/null || break; sleep 0.5; done
          if kill -0 $PID 2>/dev/null; then echo "the tray ignored SIGTERM"; kill -9 $PID; cat "$RUNNER_TEMP/tray.log"; exit 1; fi
          echo "the tray ended on SIGTERM"
          cat "$RUNNER_TEMP/tray.log"
          if grep -qi "panicked" "$RUNNER_TEMP/tray.log"; then echo "the tray panicked"; exit 1; fi

      - name: Login entry (Windows registry Run key)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $klip = (Resolve-Path .\target\debug\klip.exe).Path
          & $klip tray status
          & $klip tray install
          if ($LASTEXITCODE -ne 0) { throw "tray install failed" }
          reg query "HKCU\Software\Microsoft\Windows\CurrentVersion\Run" /v KlipTray
          if ($LASTEXITCODE -ne 0) { throw "the Run value was not written" }
          $status = (& $klip tray status) -join "`n"
          Write-Host $status
          if ($status -notmatch "Start at login: yes") { throw "status does not see the entry" }
          & $klip tray uninstall
          if ($LASTEXITCODE -ne 0) { throw "tray uninstall failed" }
          $status = (& $klip tray status) -join "`n"
          if ($status -notmatch "Start at login: no") { throw "the entry is still there" }

      - name: Tray smoke start (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:KLIP_CONFIG_DIR = "$env:RUNNER_TEMP\klip-smoke"
          $env:KLIP_CLIPBOARD = "memory"
          New-Item -ItemType Directory -Force $env:KLIP_CONFIG_DIR | Out-Null
          $p = Start-Process -FilePath ".\target\debug\klip.exe" -ArgumentList "tray","run" -PassThru -WindowStyle Hidden `
               -RedirectStandardOutput "$env:RUNNER_TEMP\tray.out" -RedirectStandardError "$env:RUNNER_TEMP\tray.err"
          Start-Sleep -Seconds 10
          if (-not $p.HasExited) {
            $p.Refresh()
            Write-Host "tray is running, pid $($p.Id), working set (KiB): $([int]($p.WorkingSet64 / 1KB))"
            Stop-Process -Id $p.Id -Force
          } else {
            Write-Host "tray exited early with code $($p.ExitCode)"
            Get-Content "$env:RUNNER_TEMP\tray.out", "$env:RUNNER_TEMP\tray.err" -ErrorAction SilentlyContinue
            throw "the tray exited early"
          }
          Get-Content "$env:RUNNER_TEMP\tray.out", "$env:RUNNER_TEMP\tray.err" -ErrorAction SilentlyContinue
          if ((Get-Content "$env:RUNNER_TEMP\tray.err" -Raw -ErrorAction SilentlyContinue) -match "panicked") { throw "the tray panicked" }
