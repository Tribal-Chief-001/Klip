name: Android APK Builder

on:
  push:
    branches: [ "main" ]
    paths:
      - 'android/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/android.yml'
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

env:
  NDK_VERSION: "28.2.13676358"

jobs:
  build-apk:
    name: Build Android app (Rust engine + Kotlin UI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Rust toolchain (Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-ndk
            target
          key: ${{ runner.os }}-android-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-android-cargo-

      - name: Install Android NDK r28 (16 KB page-size ready)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        run: command -v cargo-ndk >/dev/null || cargo install cargo-ndk --locked

      - name: Build Rust engine for Android + generate Kotlin bindings
        run: android/build-core.sh

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build APK via Gradle (release-signed when the signing secrets exist)
        working-directory: ./android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KLIP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KLIP_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KLIP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/klip-release.jks"
            export KLIP_KEYSTORE_FILE="$RUNNER_TEMP/klip-release.jks"
            gradle assembleRelease --stacktrace
            echo "APK_PATH=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets available (fork or missing secrets): building a DEBUG-signed APK"
            gradle assembleDebug --stacktrace
            echo "APK_PATH=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
          fi

      - name: Rename APK and write checksum
        run: |
          cp "android/$APK_PATH" ./Klip-Android.apk
          sha256sum Klip-Android.apk > Klip-Android.apk.sha256
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs Klip-Android.apk | head -3 || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Klip-Android-APK
          path: |
            ./Klip-Android.apk
            ./Klip-Android.apk.sha256

      - name: Attach APK to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./Klip-Android.apk
            ./Klip-Android.apk.sha256
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
