[package]
name = "klip-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
klip-core = { workspace = true }
klip-proto = { workspace = true }
klip-crypto = { workspace = true }
klip-diff = { workspace = true }
klip-platform = { workspace = true }
klip-net = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
directories = { workspace = true }

# The Windows control channel is a named pipe that only its owner may open (see ipc_pipe.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
