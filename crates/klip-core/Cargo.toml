[package]
name = "klip-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Klip platform-independent engine: config, pairing state, clip sync logic"

[dependencies]
klip-proto = { workspace = true }
klip-crypto = { workspace = true }
klip-diff = { workspace = true }
klip-platform = { workspace = true }
klip-net = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hostname = "0.4"
rand = { workspace = true }
directories = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
