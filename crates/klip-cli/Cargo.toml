[package]
name = "klip-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "klip"
path = "src/main.rs"

[dependencies]
klip-proto = { workspace = true }
klip-daemon = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
owo-colors = { workspace = true }
qrcode = { workspace = true }
unicode-width = { workspace = true }

klip-tui = { workspace = true }
async-trait = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.3"

# The menu-bar / notification-area tray: only built on the platforms that use it.
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
tray-icon = { version = "0.26", default-features = false }
tao = { version = "0.37", default-features = false, features = ["rwh_06"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
image = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
klip-tui = { workspace = true, features = ["testkit"] }
crossterm = { workspace = true }
klip-platform = { workspace = true }
klip-crypto = { workspace = true }
portable-pty = { workspace = true }
vt100 = { workspace = true }
