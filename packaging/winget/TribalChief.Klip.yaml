PackageName: Klip
Publisher: TribalChief
PublisherUrl: https://github.com/Tribal-Chief-001
PublisherSupportUrl: https://github.com/Tribal-Chief-001/Klip/issues
Author: TribalChief
ShortDescription: Peer-to-peer, end-to-end encrypted clipboard synchronization across your own devices.
Description: |
  Klip synchronizes your clipboard across Linux, Windows, macOS, and Android without third-party servers.
  Features include end-to-end encryption via QUIC/Iroh, zero cloud lock-in, CLI clipboard piping (klip copy / klip paste),
  and password manager privacy exclusion.
